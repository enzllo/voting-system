name: Delete All Repository Content

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to delete content from'
        required: true
        default: 'main'

jobs:
  delete-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete all files and folders
        run: |
          # Remove all tracked files and directories recursively
          git rm -r .
          # If there are untracked files/folders you also want to remove (optional):
          # rm -rf *
          
      - name: Commit deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Delete all repository content"

      - name: Push changes
        run: |
          git push origin ${{ github.event.inputs.branch }}   
